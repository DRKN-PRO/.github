changelog:
  exclude:
    labels:
      - skip-changelog
      - internal-only
    authors:
      - dependabot[bot]
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Improvements
      labels:
        - improvement
        - refactor
        - documentation
    - title: Security
      labels:
        - security
    - title: Performance
      labels:
        - performance
    - title: Infrastructure
      labels:
        - infrastructure
        - devops
        - docker
        - ci
    - title: Other changes
      labels:
        - "*"
